name: CrisisClarity Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        cd Project/crisis_clarity/crisisclarity-backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Security scan with pip-audit
      run: |
        pip install pip-audit
        pip-audit -r Project/crisis_clarity/crisisclarity-backend/requirements.txt

  docker-build-push:
    name: Build & Push to Docker Hub
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: DOCKER
    steps:
    - uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: |
        if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
          echo "❌ ERROR: DOCKER_USERNAME is missing."
          exit 1
        fi
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./Project/crisis_clarity/crisisclarity-backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/crisisclarity-backend:latest,${{ secrets.DOCKER_USERNAME }}/crisisclarity-backend:${{ github.sha }}

