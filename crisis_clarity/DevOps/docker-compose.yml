services:
  # 1. FastAPI Backend (Your App)
  backend:
    build:
      context: ../crisisclarity-backend
      dockerfile: Dockerfile
    container_name: crisisclarity_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - backend_logs:/app/logs

  # 2. Prometheus (Scrapes metrics from your backend)
  prometheus:
    image: prom/prometheus:latest
    container_name: crisisclarity_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # 3. Grafana (Visualizes the data)
  grafana:
    image: grafana/grafana:latest
    container_name: crisisclarity_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  backend_logs:
  prometheus_data:
  grafana_data:
