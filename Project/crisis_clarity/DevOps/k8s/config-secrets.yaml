apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  FIREBASE_PROJECT_ID: "crisisclarity"
  API_BASE_URL: "http://crisisclarity-backend-service"
  OLLAMA_BASE_URL: "http://ollama-service:11434"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # Base64 encoded values should be put here in actual deployment
  GROQ_API_KEY: "YOUR_GROQ_API_KEY"
  TELEGRAM_BOT_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN"
  NEWS_API_KEY: "YOUR_NEWS_API_KEY"
