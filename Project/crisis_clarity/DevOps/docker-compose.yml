version: '3.8'

services:
  # 1. FastAPI Backend (CrisisClarity AI system)
  backend:
    build:
      context: ../crisisclarity-backend
      dockerfile: Dockerfile
    container_name: crisisclarity_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://crisisuser:crisispass@db:5432/crisisclarity
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - ../crisisclarity-backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs

  # 2. Redis (For Caching Agent Pipeline Results)
  redis:
    image: redis:7-alpine
    container_name: crisisclarity_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. PostgreSQL (For AI Logs + Historical Alerts)
  db:
    image: postgres:15-alpine
    container_name: crisisclarity_db
    restart: always
    environment:
      - POSTGRES_USER=crisisuser
      - POSTGRES_PASSWORD=crisispass
      - POSTGRES_DB=crisisclarity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisisuser -d crisisclarity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Ollama (Local LLM Service)
  ollama:
    image: ollama/ollama:latest
    container_name: crisisclarity_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment below for GPU support if hardware is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # 5. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: crisisclarity_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_logs:
  ollama_models:
  redis_data:
